<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- same 5s loop as the other social icons: hold, "in" shrinks, badge shrinks, badge pops back, "in" grows -->
  <g transform="translate(50 50)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1.08;1;1" keyTimes="0;0.37;0.5;0.62;0.72;0.78;1" dur="5s" repeatCount="indefinite"/>
      <circle r="41" fill="#0A66C2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1;1" keyTimes="0;0.25;0.37;0.75;0.87;1" dur="5s" repeatCount="indefinite"/>
      <g transform="translate(-50 -50)" fill="#ffffff">
        <circle cx="34" cy="32" r="5"/>
        <rect x="29.5" y="41" width="9" height="29" rx="1"/>
        <path d="M45 41 H53.5 V45 C55.5 42 59 40.3 63 40.3 C70.5 40.3 73.5 45 73.5 53 V70 H64.5 V55 C64.5 50.5 63 48 59.3 48 C55.6 48 54 50.8 54 55 V70 H45 Z"/>
      </g>
    </g>
  </g>
</svg>
