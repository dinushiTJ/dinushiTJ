<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- same 5s loop as linkedin-anime.gif: hold, face shrinks, badge shrinks, badge pops back, face grows -->
  <g transform="translate(50 50)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1.08;1;1" keyTimes="0;0.37;0.5;0.62;0.72;0.78;1" dur="5s" repeatCount="indefinite"/>
      <circle r="41" fill="#FFD21E"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1;1" keyTimes="0;0.25;0.37;0.75;0.87;1" dur="5s" repeatCount="indefinite"/>
      <g transform="translate(-50 -50)">
        <g fill="#3A3B45">
          <ellipse cx="38" cy="42" rx="4.5" ry="5.5"/>
          <ellipse cx="62" cy="42" rx="4.5" ry="5.5"/>
        </g>
        <path d="M35 54 Q50 72 65 54 Q50 63 35 54 Z" fill="#3A3B45"/>
        <path d="M43 61 Q50 66 57 61 Q50 63.5 43 61 Z" fill="#EF4E4E"/>
        <g fill="#FF9D0B">
          <ellipse cx="27" cy="72" rx="9" ry="7"/>
          <ellipse cx="73" cy="72" rx="9" ry="7"/>
        </g>
      </g>
    </g>
  </g>
</svg>
