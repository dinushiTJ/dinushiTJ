<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- same 5s loop as linkedin-anime.gif: hold, iD shrinks, badge shrinks, badge pops back, iD grows -->
  <g transform="translate(50 50)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1.08;1;1" keyTimes="0;0.37;0.5;0.62;0.72;0.78;1" dur="5s" repeatCount="indefinite"/>
      <circle r="41" fill="#A6CE39"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;0;0;1;1" keyTimes="0;0.25;0.37;0.75;0.87;1" dur="5s" repeatCount="indefinite"/>
      <g transform="translate(-50 -50)" fill="#ffffff">
        <circle cx="34" cy="30" r="4.5"/>
        <rect x="30.5" y="40" width="7" height="34" rx="1"/>
        <path d="M45 40 H56 C67 40 74 47.5 74 57 C74 66.5 67 74 56 74 H45 Z M52 46 V68 H56 C63 68 67 63.5 67 57 C67 50.5 63 46 56 46 Z" fill-rule="evenodd"/>
      </g>
    </g>
  </g>
</svg>
